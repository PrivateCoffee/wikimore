[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wikimore"
version = "0.1.17"
authors = [{ name = "Private.coffee Team", email = "support@private.coffee" }]
description = "A simple frontend for Wikimedia wikis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["flask", "bs4", "flask-caching"]

optional-dependencies = { redis = ["redis"] }

[project.scripts]
wikimore = "wikimore.app:main"

[project.urls]
"Homepage" = "https://git.private.coffee/privatecoffee/wikimore"
"Bug Tracker" = "https://git.private.coffee/privatecoffee/wikimore/issues"
"Source Code" = "https://git.private.coffee/privatecoffee/wikimore"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "PLC0415"]
ignore = ["E501"]

[tool.djlint]
profile = "jinja2"
extension = "html"
ignore = "H006,H030,H031"
