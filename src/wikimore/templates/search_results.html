{% extends "base.html" %}
{% block content %}
    <h1>Search results for &ldquo;{{ query }}&rdquo;</h1>
    {% if search_results %}
        <ul class="search-results">
            {% for result in search_results %}
                <li class="search-result">
                    <a href="{{ url_for('wiki_article', project=project, lang=lang, title=result['title']) }}"
                       class="search-result-title">{{ result['title'] }}</a>
                    <p class="search-result-snippet">{{ result['snippet']|safe }}</p>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No results found for &ldquo;{{ query }}&rdquo;.</p>
    {% endif %}
{% endblock %}
