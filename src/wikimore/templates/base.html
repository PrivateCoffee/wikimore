<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light dark">
        <title>{{ title }}{% if title %} &dash; {% endif %}Wikimore</title>
        <link rel="stylesheet"
              href="{{ url_for('static', filename='css/style.css') }}">
        <link rel="stylesheet"
              href="{{ url_for('static', filename='css/dark-mode.css') }}">
        <script>
        document.addEventListener('DOMContentLoaded', function() {
            const toggle = document.getElementById('dark-mode-toggle');

            function setDarkMode(isDark) {
                document.body.classList.toggle('dark-mode', isDark);
                toggle.checked = isDark;
                localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
            }

            const saved = localStorage.getItem('darkMode');
            if (saved === 'enabled') setDarkMode(true);
            else if (saved === 'disabled') setDarkMode(false);
            else setDarkMode(window.matchMedia('(prefers-color-scheme: dark)').matches);

            toggle.addEventListener('change', () => setDarkMode(toggle.checked));
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                if (!localStorage.getItem('darkMode')) setDarkMode(e.matches);
            });
            document.addEventListener('keydown', function(e) {
                if (e.shiftKey && e.key === 'D') setDarkMode(!toggle.checked);
            });
        });
        </script>
        {% block head %}{% endblock %}
    </head>
    <body data-project="{{ project }}" data-lang="{{ lang }}">
        <div id="header">
            <div class="header-inner">
                <a href="/" class="site-name">Wikimore</a>
                <form id="search-form" action="{{ url_for("search") }}" method="post">
                    <select name="project" id="project">
                        {% for key, value in wikimedia_projects.items() %}
                            <option {% if key == project %}selected="selected"{% endif %}
                                    value="{{ key }}">{{ value }}</option>
                        {% endfor %}
                    </select>
                    <select name="lang" id="lang">
                        {% for key, value in languages.items() %}
                            <option {% if key == lang %}selected="selected"{% endif %} value="{{ key }}">{{ value["name"] }}</option>
                        {% endfor %}
                    </select>
                    <input type="text" name="query" id="query" placeholder="Search Wiki&hellip;">
                    <button type="submit">Search</button>
                </form>
                <div class="header-right">
                    <div class="dark-mode-toggle">
                        <span class="toggle-icon">☀️</span>
                        <label>
                            <input type="checkbox" id="dark-mode-toggle">
                            <span class="switch-track"></span>
                        </label>
                        <span class="toggle-icon">🌙</span>
                    </div>
                </div>
            </div>
        </div>
        <div id="content">
            <div class="page-inner">
                {% block content %}{% endblock %}
            </div>
        </div>
        <div id="footer">
            <div class="footer-inner">
                {% block license %}{% endblock %}
                <p>Brought to you by <a href="https://git.private.coffee/privatecoffee/wikimore">Wikimore</a>, a <a href="https://private.coffee">Private.coffee</a> project</p>
            </div>
        </div>
        <script src="{{ url_for('static', filename='js/preview.js') }}"></script>
    </body>
</html>
